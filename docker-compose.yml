services:
  mysqldb:
    container_name: mysql_846
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - microservices-net

  eureka-server:
    container_name: eureka-server
    image: eureka-server:latest
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  api-gateway:
    container_name: api-gateway
    image: api-gateway:latest
    build: ./api-gateway
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - microservices-net

  ms-ocorrencia:
    container_name: ms-ocorrencia
    image: ms-ocorrencia:latest
    build: ./ms-ocorrencia
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/ocorrencias?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    networks:
      - microservices-net

  ms-equipe:
    container_name: ms-equipe
    image: ms-equipe:latest
    build: ./ms-equipe
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/equipes?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure
    networks:
      - microservices-net

volumes:
  mysql-data:

networks:
  microservices-net:
    external: true