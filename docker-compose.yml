services:
  mysqldb:
    container_name: mysql_846

    image: mysql:8.4.6

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - ./.data/mysql-data8:/var/lib/mysql

    networks:
      - microservices-net

  eureka-server:
    container_name: eureka-server

    image: eureka-server:latest

    ports:
      - "8761:8761"

    networks:
      - microservices-net

  api-gateway:
    container_name: api-gateway

    image: api-gateway:latest

    ports:
      - "8082:8082"

    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

    networks:
      - microservices-net

    depends_on:
      - eureka-server
      - mysqldb

  ms-ocorrencia:
    container_name: ms-ocorrencia

    image: ms-ocorrencia:latest

    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/ocorrencias?createDatabaseIfNotExist=true&serverTimezone=UTC

    networks:
      - microservices-net

    depends_on:
      - eureka-server
      - api-gateway
      - mysqldb

  ms-equipe:
    container_name: ms-equipe

    image: ms-equipe:latest

    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/equipes?createDatabaseIfNotExist=true&serverTimezone=UTC

    networks:
      - microservices-net

    depends_on:
      - eureka-server
      - api-gateway
      - mysqldb

networks:
  microservices-net:
    external: true