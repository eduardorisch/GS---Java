spring.application.name=api-gateway

server.port=8082

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

springdoc.swagger-ui.urls[0].name=Ocorrencia
springdoc.swagger-ui.urls[0].url=/ms-ocorrencia/v3/api-docs
springdoc.swagger-ui.urls[1].name=Equipe
springdoc.swagger-ui.urls[1].url=/ms-equipe/v3/api-docs

spring.cloud.gateway.server.webflux.routes[0].id=ms-ocorrencia
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-ocorrencia
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/ocorrencias/**

spring.cloud.gateway.server.webflux.routes[1].id=ms-equipe
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-equipe
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/equipes/**